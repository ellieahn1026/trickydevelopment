<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1GPT — hackedGPT</title>
    <link rel="icon" href="./assets/icons/fabicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./assets/icons/fabicon.png" />
    <meta name="description" content="No choice. Trust GPT" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hackedGPT" />
    <meta property="og:title" content="hackedGPT" />
    <meta property="og:description" content="No choice. Trust GPT" />
    <meta property="og:url" content="https://trickydevelopment.vercel.app/f1" />
    <meta property="og:image" content="https://trickydevelopment.vercel.app/assets/icons/opengraph.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="hackedGPT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="hackedGPT" />
    <meta name="twitter:description" content="No choice. Trust GPT" />
    <meta name="twitter:image" content="https://trickydevelopment.vercel.app/assets/icons/opengraph.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Xanh+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./orbit-kr.css" />
    <link rel="stylesheet" href="./styles.css" />
    
  </head>
  <body data-character="F1">
    
    <div class="screen">
      <div class="stage">
        <svg class="composer-trail" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path class="composer-trail__path" />
        </svg>
        <div class="f1-hourglass" aria-hidden="true"></div>
        <header class="brand">
          <a href="./index.html?boot"><h1>hackedGPT</h1></a>
        </header>

        <nav class="characters" aria-label="Characters">
          
          <button
            type="button"
            class="character"
            data-name="Potter"
            data-color="#ff46ff"
            data-color-active="#ff46ff"
            data-color-hover="#ed23ed"
            data-href="./index.html"
            aria-pressed="false"
            aria-label="Open Potter chat"
          >
            <span class="character__swatch" style="--swatch: #ff46ff; --swatch-active: #ff46ff; --swatch-hover: #ed23ed">
              <img class="character__icon character__icon--default" src="./assets/icons/potter.svg" alt="" width="97" height="97" decoding="async" />
              <img class="character__icon character__icon--speaking" src="./assets/icons/potter-speaking.svg" alt="" width="97" height="97" decoding="async" aria-hidden="true" />
            </span>
            <span class="character__label">Potter</span>
          </button>
          <button
            type="button"
            class="character"
            data-name="Rupin"
            data-color="#2edbf0"
            data-color-active="#2edbf0"
            data-color-hover="#00c7df"
            data-href="./rupin.html"
            aria-pressed="false"
            aria-label="Open Rupin chat"
          >
            <span class="character__swatch" style="--swatch: #2edbf0; --swatch-active: #2edbf0; --swatch-hover: #00c7df">
              <img class="character__icon character__icon--default" src="./assets/icons/rupin.svg" alt="" width="97" height="97" decoding="async" />
              
            </span>
            <span class="character__label">Rupin</span>
          </button>
          <div class="character-group">
            
          <button
            type="button"
            class="character"
            data-name="Pepper"
            data-color="#4CFF4F"
            data-color-active="#4CFF4F"
            data-color-hover="#2DE731"
            data-href="./pepper.html"
            aria-pressed="false"
            aria-label="Open Pepper chat"
          >
            <span class="character__swatch" style="--swatch: #4CFF4F; --swatch-active: #4CFF4F; --swatch-hover: #2DE731">
              <img class="character__icon character__icon--default" src="./assets/icons/tom.svg" alt="" width="97" height="97" decoding="async" />
              
            </span>
            <span class="character__label">Pepper</span>
          </button>
            <a
              class="character character--f1 is-active"
              href="./f1.html"
              aria-current="page"
              aria-label="Open F1 chat"
            >
              <span class="character__swatch" style="--swatch: #ff670f; --swatch-active: #ff670f; --swatch-hover: #ea5600">
                <img class="character__icon character__icon--default" src="./assets/icons/f1.svg" alt="" width="97" height="97" decoding="async" />
              </span>
              <span class="character__label">F1</span>
            </a>
          </div>
        </nav>

        <div class="user-badge-zone">
          <div class="user-badge__rule" aria-hidden="true"></div>
          <div class="user-badge" aria-label="User profile">
            <span class="user-badge__avatar" aria-hidden="true">
              <span class="user-badge__initial" id="user-initial">E</span>
            </span>
            <span class="user-badge__name" id="user-display-name">Ellie</span>
          </div>
        </div>

        <div class="sideline" aria-hidden="true"></div>

        <main class="chat-panel">
          <div class="chat-panel__thread" id="chat-thread" aria-live="polite"></div>
          <div class="chat-panel__composer" id="chat-composer">
            <p class="prompt__headline" id="chat-headline" data-default-headline="I know everything. Just Ask and Believe.">I know everything. Just Ask and Believe.</p>
            <form class="prompt__form" id="chat-form" onsubmit="event.preventDefault()">
              <div class="prompt__field">
                <input
                  type="text"
                  id="chat-input"
                  name="message"
                  placeholder="Ask to F1GPT"
                  autocomplete="off"
                  aria-label="Ask to F1GPT"
                />
                <button type="submit" class="prompt__send ">Send</button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="./composer-layout.js"></script>
    <script type="module" src="./nav.js"></script>
    <script type="module" src="./user-badge.js"></script>
    <script type="module" src="./chat.js"></script>
    
  </body>
</html>
